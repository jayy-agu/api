<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jerry Agu's Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css?v=7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111'/%3E%3Ctext x='50' y='68' font-size='48' font-family='Arial,sans-serif' font-weight='800' fill='%23fff' text-anchor='middle'%3EJA%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="app"></div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <button class="modal-close" id="profile-modal-close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-body">
        <div class="profile-header">
          <div id="profile-avatar-wrap"></div>
          <div class="profile-name" id="profile-name"></div>
          <div class="profile-handle" id="profile-handle"></div>
          <div class="profile-dept" id="profile-dept"></div>
        </div>
        <input type="file" id="profile-upload" accept="image/*" style="font-size:.75rem;color:var(--muted);width:100%;">
      </div>
    </div>
  </div>

  <!-- Admin Modal -->
  <div id="admin-modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:640px;">
      <button class="modal-close" id="admin-modal-close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-body">
        <h2>Admin panel</h2>
        <div class="admin-tabs">
          <button class="admin-tab active" data-tab="add">Add member</button>
          <button class="admin-tab" data-tab="manage">Manage members</button>
          <button class="admin-tab" data-tab="logs">Access log</button>
        </div>

        <div id="tab-add" class="admin-tab-panel">
          <input class="field" id="new-user-name" placeholder="Full name" />
          <input class="field" id="new-user-password" type="password" placeholder="Password" />
          <div id="new-user-pw-hints"></div>
          <select class="field" id="new-user-dept">
            <option value="">Select Department (optional)</option>
            <option value="Legal">Legal</option>
            <option value="Branding">Branding</option>
            <option value="Operations">Operations</option>
            <option value="Sales">Sales</option>
            <option value="Marketing">Marketing</option>
            <option value="Technical Team">Technical Team</option>
          </select>
          <button class="btn-primary" id="add-teammate-btn">Add teammate</button>
        </div>

        <div id="tab-manage" class="admin-tab-panel hidden">
          <div id="manage-members-list"></div>
        </div>

        <div id="tab-logs" class="admin-tab-panel hidden">
          <div id="access-log"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mention privatize choice (shown when posting a message that @mentions exactly one teammate) -->
  <div id="privatize-modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:420px;">
      <button class="modal-close" id="privatize-modal-close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-body">
        <h2>Send to <span id="privatize-handle"></span> only, or post it?</h2>
        <p style="color:var(--muted);font-size:.85rem;margin:6px 0 18px;">You @mentioned one person. You can post this to the feed as usual, or send it as a private message that only you two can see.</p>
        <div class="privatize-choices">
          <button class="btn-primary" id="privatize-send-dm">Send privately</button>
          <button class="btn-secondary" id="privatize-post-public">Post to feed instead</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Direct Messages -->
  <div id="dm-modal" class="modal-overlay hidden">
    <div class="modal-box dm-box">
      <button class="modal-close" id="dm-modal-close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-body">
        <div id="dm-list-view">
          <div class="dm-header">
            <h2>Messages</h2>
            <button class="btn-small" id="dm-new-btn">+ New message</button>
          </div>
          <div id="dm-new-picker" class="hidden"></div>
          <div id="dm-conversations"></div>
        </div>
        <div id="dm-thread-view" class="hidden">
          <button class="back-link" id="dm-back-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            All messages
          </button>
          <div id="dm-thread-header"></div>
          <div id="dm-thread-messages"></div>
          <div class="reply-compose">
            <textarea id="dm-textarea" placeholder="Write a private message…" rows="2"></textarea>
            <button id="dm-send-btn">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Reply Modal -->
  <div id="reply-modal" class="modal-overlay hidden">
    <div class="modal-box reply-box">
      <button class="modal-close" id="reply-modal-close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-body">
        <h2>Thread</h2>
        <div id="reply-original-post"></div>
        <div id="reply-comments-list"></div>
        <div class="reply-compose">
          <textarea id="reply-textarea" placeholder="Write a reply…" rows="2"></textarea>
          <button id="reply-send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=7"></script>
</body>
</html>
